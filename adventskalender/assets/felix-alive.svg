<style>
.figure{transform-origin:90px 183px;animation:sway 7s ease-in-out infinite}
.eyes{transform-origin:90px 78px;animation:blink 5.7s linear infinite}
.hand{transform-origin:125px 141px;animation:wave 7s ease-in-out infinite}
