@keyframes blink{0%,41%,45%,100%{transform:scaleY(1)}43%{transform:scaleY(.1)}}
@keyframes wave{0%,10%,62%,100%{transform:rotate(0)}24%,40%{transform:rotate(-100deg)}32%,48%{transform:rotate(-80deg)}}
@media(prefers-reduced-motion:reduce){.figure,.eyes,.hand{animation:none}}
</style>
