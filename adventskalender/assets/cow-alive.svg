<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 190" style="--eye-origin:90px 83px;--mouth-origin:90px 116px"><style>
.plush-body{transform-origin:90px 155px;animation:plush-sway 6s ease-in-out infinite}
.plush-eyes{transform-origin:var(--eye-origin);animation:plush-blink 5.4s linear infinite}
.plush-mouth{transform-origin:var(--mouth-origin);animation:plush-talk 4.8s ease-in-out infinite}
.plush-wave{transform-origin:123px 112px;animation:plush-wave 5.8s ease-in-out infinite}
.plush-listen{transform-origin:58px 112px;animation:plush-listen 6s ease-in-out infinite}
@keyframes plush-sway{0%,100%{transform:rotate(-2deg) translateY(0)}45%{transform:rotate(2.5deg) translateY(-2px)}70%{transform:rotate(0) translateY(-1px)}}
@keyframes plush-blink{0%,43%,47%,88%,92%,100%{transform:scaleY(1)}45%,90%{transform:scaleY(.08)}}
@keyframes plush-talk{0%,9%,18%,27%,36%,100%{transform:scaleY(1)}4.5%,13.5%,22.5%,31.5%{transform:scaleY(.5)}}
@keyframes plush-wave{0%,12%,62%,100%{transform:rotate(0)}25%,41%{transform:rotate(-105deg)}33%,49%{transform:rotate(-80deg)}}
@keyframes plush-listen{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(7deg)}}
@keyframes plush-flutter{0%,100%{transform:rotate(-5deg) translateY(0)}40%{transform:rotate(6deg) translateY(-4px)}70%{transform:rotate(-1deg) translateY(-1px)}}
@keyframes plush-nod{0%,100%{transform:rotate(-2deg) translateY(0)}25%{transform:rotate(3deg) translateY(-3px)}35%{transform:rotate(0) translateY(1px)}45%{transform:rotate(2deg) translateY(-2px)}65%{transform:rotate(0) translateY(0)}}
@media(prefers-reduced-motion:reduce){.plush-body,.plush-eyes,.plush-mouth,.plush-wave,.plush-listen{animation:none!important}}
