<ellipse cx="61" cy="167" rx="15" ry="10" fill="#ded2b2" stroke="none" /><ellipse cx="119" cy="167" rx="15" ry="10" fill="#ded2b2" stroke="none" />
<circle cx="47" cy="47" r="20" fill="#c9bb97" /><circle cx="133" cy="47" r="20" fill="#c9bb97" /><circle cx="47" cy="47" r="12" fill="#e0d1ad" stroke="none" /><circle cx="133" cy="47" r="12" fill="#e0d1ad" stroke="none" />
